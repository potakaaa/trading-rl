[project]
name = "ict-signal-assistant"
version = "0.1.0"
description = "ICT + ML trading signal assistant for US100 (signals only, prop-firm safe)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "lightgbm",
    "scikit-learn",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "apscheduler",
    "httpx",
    "plotly>=7.1.0",
    "torch>=2.14.1",
    "databento>=0.87.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/data/quality.py" = ["E501"]  # HTML template
